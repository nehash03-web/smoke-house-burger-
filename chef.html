<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoke House Kitchen</title><style>:root{--g:#ffb300;--bg:#0b0b0c;--card:#18181b;--green:#22c55e;--blue:#38bdf8;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding:18px}header{text-align:center}.logo{font-size:48px}h1{color:var(--g);margin:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:900px;margin:18px auto}.stat,.order,.empty{background:var(--card);border:1px solid #303036;border-radius:14px;padding:14px}.stat{text-align:center}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.order{border-left:7px solid var(--orange)}.order.cooking{border-color:var(--blue)}.order.ready{border-color:var(--green);box-shadow:0 0 20px #22c55e44}.token{color:var(--g);font-size:22px;font-weight:900}.items{background:#222;padding:10px;border-radius:9px;margin:10px 0}.opts{color:#aaa;font-size:12px}.note{color:#ffd166}.total{font-size:19px;font-weight:bold;margin:9px 0}button{border:0;border-radius:9px;padding:10px;font-weight:bold;margin:3px;cursor:pointer}.cook{background:var(--blue)}.readyb{background:var(--green)}.done{background:#ef4444;color:#fff}.readybanner{background:var(--green);color:#04120a;padding:10px;border-radius:9px;font-weight:1000;text-align:center;font-size:19px;margin:8px 0}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="logo">🍔🔥</div><h1>Smoke House Kitchen</h1><div>Live Order Dashboard</div></header><div class="stats"><div class="stat"><b id="all">0</b><br>Active</div><div class="stat"><b id="pending">0</b><br>Pending</div><div class="stat"><b id="cooking">0</b><br>Cooking</div><div class="stat"><b id="ready">0</b><br>Ready</div></div><div id="orders" class="orders"></div><script>
const statusChannel=('BroadcastChannel' in window)?new BroadcastChannel('smokehouse-orders'):null;statusChannel?.addEventListener('message',()=>load());
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){const a=JSON.parse(localStorage.getItem('orders')||'[]');all.textContent=a.length;pending.textContent=a.filter(x=>x.status==='pending').length;cooking.textContent=a.filter(x=>x.status==='cooking').length;ready.textContent=a.filter(x=>x.status==='ready').length;if(!a.length){orders.innerHTML='<div class="empty">✅ No active orders</div>';return}orders.innerHTML=a.map((o,i)=>`<article class="order ${o.status}"><div class="token">${esc(o.token)}</div><div>👤 ${esc(o.customer)}</div>${o.status==='ready'?'<div class="readybanner">✅ READY FOR COLLECTION</div>':`<div><b>${o.status.toUpperCase()}</b></div>`}<div class="items">${(o.items||[]).map(x=>`<div>${esc(x.name)} × ${x.qty}${x.options?.length?`<div class="opts">${x.options.map(esc).join(' · ')}</div>`:''}</div>`).join('')}</div>${o.notes?`<div class="note">📝 ${esc(o.notes)}</div>`:''}${o.saving?`<div style="color:#22c55e">Customer saving: AED ${o.saving}</div>`:''}${o.total!=null?`<div class="total">Total AED ${o.total}</div>`:''}<button class="cook" onclick="statusSet(${i},'cooking')">👨‍🍳 Cooking</button><button class="readyb" onclick="statusSet(${i},'ready')">✅ Ready</button><button class="done" onclick="done(${i})">📦 Collected</button></article>`).join('')}
function syncActive(order){const active=JSON.parse(localStorage.getItem('activeOrder')||'null');if(active&&active.token===order.token)localStorage.setItem('activeOrder',JSON.stringify({...active,...order}))}
function statusSet(i,s){const a=JSON.parse(localStorage.getItem('orders')||'[]');if(!a[i])return;a[i].status=s;syncActive(a[i]);localStorage.setItem('orders',JSON.stringify(a));statusChannel?.postMessage({type:'status-changed',token:a[i].token,status:s});load()}
function done(i){const a=JSON.parse(localStorage.getItem('orders')||'[]');if(!a[i])return;const order={...a[i],status:'collected'};syncActive(order);const completed=JSON.parse(localStorage.getItem('completedOrders')||'[]');completed.unshift(order);localStorage.setItem('completedOrders',JSON.stringify(completed.slice(0,100)));a.splice(i,1);localStorage.setItem('orders',JSON.stringify(a));statusChannel?.postMessage({type:'status-changed',token:order.token,status:'collected'});load()}
window.addEventListener('storage',load);setInterval(load,1000);load();</script></body></html>
